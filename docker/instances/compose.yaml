services:
  codebot:
    image: ghcr.io/nightly-labs/openbot:${CODEBOT_TAG:-latest}
    container_name: codebot-${CODEBOT_NAME:?}
    restart: unless-stopped
    security_opt:
      - seccomp=../seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: ${CODEBOT_CPUS:?}
    mem_limit: ${CODEBOT_MEM:?}
    memswap_limit: ${CODEBOT_MEM:?}
    pids_limit: 8192
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=${CODEBOT_TMP:-8g}
      - /var/tmp:exec,mode=1777,size=1g
      - /run/lock:mode=1777,size=1m
      - /run/codebot:mode=0700,uid=1000,gid=1000,size=64m
    volumes:
      - /srv/codebot/${CODEBOT_NAME:?}/data:/data
      - /srv/codebot/${CODEBOT_NAME:?}/update-requests:/var/lib/codebot-update/requests
      - /srv/codebot/${CODEBOT_NAME:?}/update-status:/var/lib/codebot-update/status:ro
    networks:
      - codebot
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///var/lib/codebot-docker/dev/log
        tag: "{{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m

networks:
  codebot:
    external: true
