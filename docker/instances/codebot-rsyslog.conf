template(name="CodebotDockerFile" type="string" string="/var/log/codebot/%programname%.log")
template(name="CodebotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="codebot-docker") {
  if $programname startswith "codebot-" then {
    action(type="omfile" dynaFile="CodebotDockerFile" template="CodebotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/codebot-docker/dev/log" ruleset="codebot-docker" createPath="off")
