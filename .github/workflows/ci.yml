name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Type-check the main process, the backend and the scripts
        run: bun run typecheck:node

      - name: Type-check the renderer
        run: bun run typecheck:renderer

      - name: Type-check the contracts and the translations
        run: |
          bun run typecheck:contracts
          bun run typecheck:i18n

      - name: Lint
        run: bun run lint

      - name: Check the UI rules
        run: bun run check:ui

      - name: Check the translation catalogs
        run: bun run i18n:check

      - name: Check unused files and dependencies
        run: bun run knip:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the unit tests
        run: bun run test:desktop

      - name: Run the update and release script tests
        run: |
          bun run test:app-update
          bun run test:release-script
